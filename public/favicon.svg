<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EduVerse">
  <!--
    The EduVerse mark: the same rounded tile, --gradient-primary fill and white
    mortarboard used for the brand lockup in src/components/layout/AppShell.tsx
    and src/components/auth/AuthShell.tsx.

    The cap is drawn as solid shapes rather than the stroked lucide
    GraduationCap the app renders at 32-36px. A 1.5px stroke scaled into a 16px
    favicon leaves lines thinner than a pixel, which anti-aliases into grey mush;
    filled shapes keep the silhouette legible all the way down.

    Geometry is duplicated in scripts/generate-icons.ts, which rasterises
    favicon.ico and apple-touch-icon.png. Change both together.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047490" />
      <stop offset="1" stop-color="#0c60c0" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)" />

  <g fill="#fff">
    <!-- mortarboard -->
    <path d="M7 27 32 15 57 27 32 39Z" />
    <!-- crown below the board -->
    <path d="M22 33h20v6a10 6.5 0 0 1-20 0Z" />
    <!-- tassel -->
    <rect x="50.5" y="25" width="4" height="17" rx="2" />
    <circle cx="52.5" cy="45" r="4.5" />
  </g>
</svg>
